[project]
name = "crypts-and-commits"
version = "0.1.0"
description = "A Coding Assistant Continuity Framework. Crypts and Commits uses a tabletop-gaming metaphor to describe collaboration between a developer and an AI coding assistant. The developer acts as the Game Master: establishing context, making decisions, and retaining final authority."
authors = [
    {name = "John Hoff",email = "john.hoff@braindonor.net"},
]
dependencies = ["typer", "rich", "click", "python-frontmatter", "mcp", "tomlkit>=0.15.1"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.scripts]
cac = "cac.cli.app:app"
cac-mcp = "cac.mcp.server:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
