[project]
name = "demo-api"
version = "0.1.0"
description = "A Coding Assistant Continuity Framework. Demonstration API"
authors = [
    {name = "John Hoff",email = "john.hoff@braindonor.net"},
]
dependencies = ["fastapi>=0.141.1", "uvicorn[standard]>=0.52.1", "langgraph>=1.2.10", "langgraph-checkpoint-sqlite>=3.1.1", "langchain-openai>=1.4.1", "python-dotenv>=1.2.2", "uuid6>=2025.0.1"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = false
